# ============================================================
# default_ar.yaml — Autoregressive EDM nowcasting
#
# Key differences vs default.yaml (direct multi-step):
#   - T_out: 1  (the AR model predicts one step at a time)
#   - T_ar:  36 (number of AR rollout steps at inference = 6h)
#   - batch_size: 8 (can be larger — single-step target is smaller)
#   - base_channels: 128 (same model capacity)
#
# At training each batch item draws one random target step, so
# effective samples per epoch = sequences × T_out — much denser
# supervision than the direct model.
#
# At inference run:
#   python infer_ar.py --config configs/default_ar.yaml \
#       --checkpoint outputs/run_ar/best.pt ...
# ============================================================

# ----------------------------------------------------------
# Data
# ----------------------------------------------------------
train_roots:
  # - /home/vladlanda/Workplace/LI-DATASETS/small/central_africa_1
  - /home/vladlanda/Workplace/LI-DATASETS/full/central_africa_1
  - /home/vladlanda/Workplace/LI-DATASETS/full/central_africa_2
  - /home/vladlanda/Workplace/LI-DATASETS/full/central_africa_3

# Held-out regions — NEVER used during training.
# Only passed to evaluate.py after training is complete.
test_roots:
  # - /home/vladlanda/Workplace/LI-DATASETS/small/central_africa_2
  - /home/vladlanda/Workplace/LI-DATASETS/full/central_africa_4

  
train_val_split: 0.8
channels: [ir, li, ch0, ch1]

T_in:     18        # context frames (same as direct model)
T_out:    6       # stored in dataset for AR context building; AR predicts 1 at a time
dt_min:   10
img_size: [64, 64]
max_samples: null

# ----------------------------------------------------------
# Model (identical backbone to direct model)
# ----------------------------------------------------------
base_channels:    128
channel_mults:    [1, 2, 3, 4]
num_res_blocks:   2
attn_resolutions: [16, 8]
dropout:          0.1
emb_dim:          512
sigma_data:       0.5

# ----------------------------------------------------------
# EDM noise schedule
# ----------------------------------------------------------
P_mean:    -1.2
P_std:      1.2
sigma_min:  0.002
sigma_max:  80.0

# ----------------------------------------------------------
# Training
# ----------------------------------------------------------
epochs:          200
batch_size:      16        # larger than direct model (single-step target)
lr:              1.0e-4
weight_decay:    1.0e-4
grad_clip:       1.0
ema_decay:       0.9999
amp:             true
num_workers:     4
cfg_drop_prob:   0.15
spectral_weight: 0.1
li_weight:       3.0

# ----------------------------------------------------------
# Inference / evaluation
# ----------------------------------------------------------
T_ar:       6       # autoregressive steps to unroll at eval/infer time
n_members:  10
cfg_scale:  1.5

# ----------------------------------------------------------
# Validation & logging
# ----------------------------------------------------------
slow_val:     false      # AR rollout is slow — keep fast val during training
val_every:    10
val_samples:  -1

output_dir:      outputs/fh1_dh3_dim64_ar
resume:          false
wandb_project:   "DDIM-LI-AR"
