# ============================================================
# METSAT Lightning Nowcasting — Evaluation Configuration
# ============================================================
# Usage:
#   python evaluate.py --config configs/evaluate.yaml
#   python evaluate.py --config configs/evaluate.yaml --S_churn 80

# ----------------------------------------------------------
# Paths
# ----------------------------------------------------------
checkpoint:   outputs/v2_ir_li/best.pt

test_roots:
  - /home/vladlanda/Workplace/LI-DATASETS/split/test/central_africa_1
  - /home/vladlanda/Workplace/LI-DATASETS/split/test/central_africa_2
  - /home/vladlanda/Workplace/LI-DATASETS/split/test/central_africa_3
  - /home/vladlanda/Workplace/LI-DATASETS/split/test/central_africa_4

output_dir:   outputs/v2_ir_li/eval_test_ens50

# ----------------------------------------------------------
# Ensemble sampling
# ----------------------------------------------------------
n_members:    50
cfg_scale:    1.5
num_steps:    20
S_churn:      40.0         # with num_steps 20, any S_churn >= 8.28 saturates (gamma capped at sqrt2-1); set from tune_sampling_on_val.py
S_noise:      1.003

# ----------------------------------------------------------
# Metrics
# ----------------------------------------------------------
fss_prob_thresholds:  [0.1, 0.3, 0.5]
fss_scales:           [1, 2, 4, 8, 16, 32]
pixel_size_km:        3.14
li_event_threshold:   0.00196078   # 0.5/255 = AFA >= 1 (any lightning). AFA>=5 sensitivity: 0.017647

# ----------------------------------------------------------
# Plots
# ----------------------------------------------------------
plot:          true
plot_only:     false
max_plots:     20

# ----------------------------------------------------------
# Hardware
# ----------------------------------------------------------
gpu:          0
batch_size:   32
num_workers:  4
img_size:     [256, 256]
