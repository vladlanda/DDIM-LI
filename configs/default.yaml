# ============================================================
# METSAT Lightning Nowcasting — Default Configuration
# ============================================================
# Usage:
#   python train.py --config configs/default.yaml
#   python train.py --config configs/default.yaml --lr 5e-5   # CLI overrides YAML

# ----------------------------------------------------------
# Data
# ----------------------------------------------------------
# Regions used for training. Internally split into train/val
# via train_val_split (temporal — no data leakage).
train_roots:
  # - /home/vladlanda/Workplace/LI-DATASETS/small/central_africa_1
  - /home/vladlanda/Workplace/LI-DATASETS/full/central_africa_1
  - /home/vladlanda/Workplace/LI-DATASETS/full/central_africa_2
  - /home/vladlanda/Workplace/LI-DATASETS/full/central_africa_3

# Held-out regions — NEVER used during training.
# Only passed to evaluate.py after training is complete.
test_roots:
  # - /home/vladlanda/Workplace/LI-DATASETS/small/central_africa_2
  - /home/vladlanda/Workplace/LI-DATASETS/full/central_africa_4

# First 70% of each region's sequences → train, last 30% → val.
# Split is temporal (chronological), not random.
train_val_split: 0.8
 
channels:           # order matters: index 0=ir, 1=li, 2=ch0, 3=ch1
  - ir
  - li
  - ch0
  - ch1
 
T_in:    18          # context frames  (6 × 10 min = 1 hour)
T_out:   36         # forecast steps  (36 × 10 min = 6 hours)
dt_min:  10         # minutes between frames
img_size: [64, 64]
 
# Set to a small integer (e.g. 50) to load only a subset of sequences.
# Useful for quickly verifying the pipeline works before a full training run.
# null = load everything (production default)
max_samples: null
 
# ----------------------------------------------------------
# Model architecture
# ----------------------------------------------------------
base_channels:     128
channel_mults:     [1, 2, 3, 4]   # feature map sizes: 128, 256, 384, 512
num_res_blocks:    2
attn_resolutions:  [16, 8]        # apply self-attention at these spatial sizes
dropout:           0.1
emb_dim:           512            # conditioning embedding dimension
sigma_data:        0.5            # EDM sigma_data (≈ std of normalised targets)
 
# ----------------------------------------------------------
# EDM noise schedule
# ----------------------------------------------------------
P_mean:    -1.2    # lognormal mean for sigma sampling
P_std:      1.2    # lognormal std  for sigma sampling
sigma_min:  0.002
sigma_max:  80.0
 
# ----------------------------------------------------------
# Training
# ----------------------------------------------------------
# batch_size is PER GPU.
# With 2 × RTX 5090 and batch_size=4 → effective batch = 8.
# RTX 5090 has 32 GB VRAM — you can push batch_size to 8 or 16
# depending on img_size and T_in/T_out.
epochs:         100
batch_size:     64
lr:             1.0e-4
weight_decay:   1.0e-4
grad_clip:      1.0
ema_decay:      0.9999
amp:            true       # mixed precision (bf16 preferred on Ada/Blackwell GPUs)
num_workers:    4          # per GPU; total CPU workers = num_workers × num_gpus
 
# Loss weights
cfg_drop_prob:    0.15     # probability of nulling context (for CFG training)
spectral_weight:  0.1      # FFT magnitude loss weight
li_weight:        3.0      # upweight lightning channel in MSE
 
# ----------------------------------------------------------
# Validation & logging
# ----------------------------------------------------------
slow_val:     false         # set false to skip ODE-solver eval during exploratory runs
val_every:    10            # run full ensemble validation every N epochs
val_samples:  -1           # batches for both fast (every epoch) and slow (every val_every) val
                           # -1 = full val set; >0 = random sample of that many batches
n_members:    1            # ensemble members during validation (1 = fast, 10 = full probabilistic)
cfg_scale:    1.5          # classifier-free guidance scale at inference
 
output_dir:      outputs/h6_dh3_dim64
resume:          true
wandb_project:   "DDIM-LI"        # set to your project name to enable WandB