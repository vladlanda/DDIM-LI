# ============================================================
# METSAT Lightning Nowcasting — nonelbo branch
# ============================================================
# Usage:
#   python train.py --config configs/default.yaml
#   python train.py --config configs/default.yaml --lr 5e-5   # CLI overrides YAML

# ----------------------------------------------------------
# Data
# ----------------------------------------------------------
train_roots:
  - /home/vladlanda/Workplace/LI-DATASETS/split_v2/train/central_africa_1
  - /home/vladlanda/Workplace/LI-DATASETS/split_v2/train/central_africa_2
  - /home/vladlanda/Workplace/LI-DATASETS/split_v2/train/central_africa_3
  - /home/vladlanda/Workplace/LI-DATASETS/split_v2/train/central_africa_4

test_roots:
  - /home/vladlanda/Workplace/LI-DATASETS/split_v2/test/central_africa_1
  - /home/vladlanda/Workplace/LI-DATASETS/split_v2/test/central_africa_2
  - /home/vladlanda/Workplace/LI-DATASETS/split_v2/test/central_africa_3
  - /home/vladlanda/Workplace/LI-DATASETS/split_v2/test/central_africa_4

# Temporal split — first 80% train, last 20% validation (no leakage)
train_val_split: 0.8

# 2-channel model: ir105 + li only. ch0(ir87)/ch1(ir97)/ch2(ir123) were
# tested and dropped — pre-registered, sequence-bootstrap-CI'd conditional
# information tests (existence regime, level AND ~2h tendency) found none
# of the three added information beyond ir105 level + ir105 tendency + LI
# history: ir97 sat at the RANDOM null in every test; ir87 and ir123
# tendency both failed the pre-specified decision rule (CI did not clear
# the ir105-tendency floor). See test_ir123_tendency_hypothesis.py and
# diagnose_cooling_rate.py for the evidence chain.
channels:
  - ir
  - li

T_in:    36         # context frames  (36 × 10 min = 6 hours)
T_out:   6          # forecast steps  (6  × 10 min = 1 hour)
dt_min:  10
img_size: [256, 256]
max_samples: null

# ----------------------------------------------------------
# Model architecture
# ----------------------------------------------------------
base_channels:     64
channel_mults:     [1, 2, 3, 4]
num_res_blocks:    2
attn_resolutions:  [64, 32]
dropout:           0.1
emb_dim:           256
seed:              0               # global random seed (offset by rank under DDP); vary only for seed-robustness runs
epoch_fraction:    0.33             # each epoch draws this fraction of the weighted training sequences (with
                                  # replacement); every sequence stays eligible every epoch. Full pass
                                  # over ~144k stride-1 sequences is otherwise ~9k steps per epoch.
use_packed:        false           # true after preprocess_to_memmap.py for every training region
                                  # (PNG decoding left the GPU idle ~75% of the time)
preload_to_ram:    false           # with use_packed: hold packed frames in RAM (~6 GB per region)
augment_flip:      false           # east-west flip of training samples. OFF: Central/West African
                                  # convective systems propagate predominantly westward (mid-level
                                  # easterlies), so mirrored samples are unrealistic. Same for ALL models.
sigma_data:        0.66            # measured on v2 data (check_residual_stats.py, pooled over 4 regions, 1200 seqs): RMS of residual targets; ir std 0.42, li std 0.83
                                  # set (out_channels changed 4->2, RMS of residuals changes).
                                  # Run: python check_residual_stats.py <train_roots>
                                  # Typical range for normalised residuals: 0.2-0.5.
                                  # Wrong value biases EDM preconditioner (Karras 2022).
                                  # Affects c_skip/c_out/c_in scalars and loss weight λ(σ).

# ----------------------------------------------------------
# EDM noise schedule
# ----------------------------------------------------------
P_mean:    -1.2
P_std:      1.2
sigma_min:  0.002
sigma_max:  80.0

# ----------------------------------------------------------
# Training
# ----------------------------------------------------------
epochs:         999   # = TRAINING BUDGET in (short) epochs: the cosine LR schedule spans exactly this many.
                                  # Set from the measured epoch time before a long run; stopping early leaves the LR un-annealed.
batch_size:     16
lr:             2.0e-4
weight_decay:   0.0               # EMA already regularises (Karras 2022)
grad_clip:      1.0
ema_decay:      0.999991          # half-life ~77k optimiser steps (independent of epoch length)
                                  # ema_decay=0.9999 designed for ~100 steps/epoch
                                  # = 0.94-epoch half-life on full dataset (too fast)
amp:            true
num_workers:    4

# ----------------------------------------------------------
# Loss function
# ----------------------------------------------------------
cfg_drop_prob:   0.15

# Channel weighting — Cui et al. 2019 effective number formula
li_weight:       20.0
li_weight_beta:  0.9999
li_weight_ref_density: 0.0359     # mean LI density of training set (measured)

# Asymmetric FP/FN loss — Gao et al. 2022
# Reduces FAR by penalising false positives less than false negatives early in training
asym_weight:     0.0   # primary model: pure EDM denoising objective (see PAPER_TODO, decision 4); ablation: set > 0
asym_alpha:      0.05   # FP penalised at 5% of FN cost — more aggressive with LI in ctx

# Neighbourhood spatial loss — Zhang et al. 2023
# Penalises spatial displacement; directly improves FSS
nbr_weight:      0.0   # primary model: pure EDM denoising objective (see PAPER_TODO, decision 4); ablation: set > 0
nbr_scales:      [5, 11]   # kernel sizes in pixels (≈20km and ≈44km at 4km/px)

# Spectral loss — applied to IR/cloud channels only (not LI)
spectral_weight: 0.0   # primary model: pure EDM denoising objective (see PAPER_TODO, decision 4); ablation: set > 0

# Lead-time weighted sampling
# Oversample harder long-range steps to improve +60min skill.
# Values are relative weights per step (normalised to probabilities).
# Resume-compatible: not stored in checkpoint, set freely.
lead_time_weights: null            # uniform — oversampling showed no benefit

# Stratified sequence sampling
oversample_factor:  5.0    # top-density sequences oversampled N×
density_percentile: 75.0   # 75th percentile LI density threshold

# Binary LI context channel — Ravuri et al. 2021
# Appends (AFA >= 1) as extra channel to each context frame
binary_li_ctx:   true              # explicit binary LI mask per context frame

# ctx_channels: which channels to include in context (null = all channels)
# To exclude LI from context and force prediction from IR alone:
#   ctx_channels: [ir, ch0, ch1] or null
ctx_channels:    null              # all channels — LI included in context

# ----------------------------------------------------------
# Validation & logging
# ----------------------------------------------------------
slow_val:     false
val_every:    10
val_samples:  200   # validation batches per epoch: a FIXED seeded subset (comparable across epochs); -1 = all
n_members:    1
cfg_scale:    1.5

output_dir:      outputs/v2/ir_li          # NEW folder for v2 data: train.py caches channel_stats.json here,
                                          # so reusing the old run's folder would load the OLD data's stats
resume:          false             # new architecture: in_ch 188->112 (2ch, dropped ch0/ch1)
wandb_project:   "DDIM-LI"

# LI event threshold for binarisation (evaluation only)
li_event_threshold: 0.00196078   # 0.5/255 = AFA >= 1 (any lightning); AFA>=5 sensitivity: 0.017647 (4.5/255)
